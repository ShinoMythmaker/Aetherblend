name: Rebuild docs after release

on:
  workflow_run:
    workflows: ["Update repo.json on Release"]
    types: [completed]
  # Picks up new Meddle/FFGear releases from the master repo.json
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-docs:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install docs dependencies
        run: pip install markdown pygments

      - name: Build docs and sync README
        run: python docs/build.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md docs; then
            echo "No docs changes to commit"
            exit 0
          fi
          git add README.md docs
          git commit -m "Rebuild docs (${{ github.event_name }})"
          git pull --rebase origin ${{ github.event.repository.default_branch }}
          git push origin HEAD:${{ github.event.repository.default_branch }}
